name: Architecture Check

on:
  push:
    branches: [main, architecture-refactor-2026-08]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orchestra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d orchestra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orchestra
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-jwt-secret-012345678901234567890123
      ENCRYPTION_KEY: ci-encryption-key-012345678901234567
      SERVICE_TOKEN: ci-service-token-012345678901234567890123
      SCHEDULER_SECRET: ci-scheduler-secret-012345678901234567890123
      CORS_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
